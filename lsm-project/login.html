<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS - Login</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div class="form-container">
        <h2>LMS Login</h2>
        <form id="loginForm">
            <label for="email">Email Address:</label>
            <input type="email" id="email" required placeholder="Enter your email">
            
            <label for="password">Password:</label>
            <input type="password" id="password" required placeholder="Enter password">

            <label for="role">Login As:</label>
            <select id="role">
                <option value="student">Student</option>
                <option value="faculty">Faculty</option>
                <option value="admin">Admin</option>
            </select>

            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="register.html">Register here</a></p>
    </div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value.trim();
  const selectedRole = document.getElementById('role').value;

  // স্পেসিফিক ইমেইল, পাসওয়ার্ড এবং ড্যাশবোর্ডের ডিরেক্ট পাথ
  const validUsers = {
    'student@gmail.com': { password: 'student123', role: 'student', page: 'dashboard/student-dashboard.html', name: 'Student Account' },
    'faculty@gmail.com': { password: 'faculty123', role: 'faculty', page: 'dashboard/faculty-dashboard.html', name: 'Faculty Account' },
    'admin@gmail.com':   { password: 'admin123',   role: 'admin',   page: 'dashboard/admin-dashboard.html',   name: 'Admin Account' }
  };

  const user = validUsers[email];

  if (!user) {
    alert('ইমেইলটি সঠিক নয়! সঠিক ইমেইল ব্যবহার করুন (student@gmail.com, faculty@gmail.com, admin@gmail.com)');
    return;
  }

  if (user.password !== password) {
    alert('পাসওয়ার্ড ভুল হয়েছে!');
    return;
  }

  if (user.role !== selectedRole) {
    alert(`রোল অপশন ভুল নির্বাচন করা হয়েছে! এই অ্যাকাউন্টের জন্য "${user.role}" সিলেক্ট করুন।`);
    return;
  }

  // Session storage & Local storage এ ডেটা বসিয়ে ডিরেক্ট রিডাইরেক্ট
  localStorage.setItem('token', 'fake-jwt-token-edutrack');
  localStorage.setItem('user', JSON.stringify({ name: user.name, email: email, role: user.role }));

  // ড্যাশবোর্ডে সরাসরি পাঠাবে
  window.location.href = user.page;
});
</script>
</body>
</html>
